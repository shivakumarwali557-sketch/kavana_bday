<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Kavana 🎈</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; overflow:hidden;
  display:flex; justify-content:center; align-items:center;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#ffd6e7,#fcefff,#dff5ff);
  color:#5b3150;
}
.scene{width:100%;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.instruction{font-size:clamp(22px,5vw,36px);font-weight:700;margin-bottom:35px;animation:pulse 1.5s infinite}
.balloon{
  width:150px;height:185px;border-radius:50% 50% 48% 48%;
  background:radial-gradient(circle at 32% 25%,#fff 0 5%,#ff9bc5 7%,#f45194 45%,#d92978 100%);
  box-shadow:inset -15px -20px 25px rgba(130,0,65,.18),0 15px 35px rgba(120,30,80,.2);
  position:relative;cursor:pointer;
  animation:float 2.5s ease-in-out infinite;
}
.balloon:after{
  content:"";position:absolute;left:50%;bottom:-12px;transform:translateX(-50%);
  border-left:10px solid transparent;border-right:10px solid transparent;border-top:16px solid #d92978;
}
.balloon .text{color:white;text-align:center;font-size:22px;font-weight:bold;line-height:1.2;margin-top:70px;text-shadow:0 2px 4px #9d205a}
.string{height:120px;width:2px;background:#a8738e;margin-top:0}
.hint{margin-top:15px;color:#8b5978}
.hidden{display:none!important}
.card{
  width:min(90%,600px);padding:42px 28px;border-radius:25px;text-align:center;
  background:rgba(255,255,255,.9);box-shadow:0 20px 60px rgba(100,40,80,.2);
  animation:cardIn .9s ease-out;
}
.card h1{margin:0;color:#e83f91;font-size:clamp(38px,9vw,64px)}
.card h2{margin:8px 0 22px;font-size:clamp(26px,6vw,38px)}
.card p{font-size:19px;line-height:1.7;margin:0}
.heart{font-size:38px;margin-top:20px;animation:pulse 1s infinite}
.confetti{position:fixed;top:-20px;width:10px;height:16px;animation:fall linear forwards;pointer-events:none}
.pop{
  position:fixed;font-size:40px;font-weight:900;color:#e83f91;
  animation:popText .7s ease-out forwards;pointer-events:none;
}
@keyframes float{50%{transform:translateY(-20px) rotate(2deg)}}
@keyframes pulse{50%{transform:scale(1.05)}}
@keyframes cardIn{from{opacity:0;transform:scale(.7) translateY(40px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.8}}
@keyframes popText{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.3);opacity:1}100%{transform:scale(1);opacity:0}}
</style>
</head>
<body>
<div class="scene" id="start">
  <div class="instruction">🎈 Hey Kavana! 🎈</div>
  <div class="balloon" id="balloon" aria-label="Tap the balloon">
    <div class="text">TAP<br>ME!</div>
  </div>
  <div class="string"></div>
  <div class="hint">Tap the balloon 👆</div>
</div>

<div class="scene hidden" id="wish">
  <div class="card">
    <div style="font-size:28px">🎉✨🎈✨🎉</div>
    <h2>Happy Birthday</h2>
    <h1>KAVANA</h1>
    <p>
      Wishing you a very happy birthday! ❤️<br>
      May your life always be filled with happiness,<br>
      success, and lots of beautiful moments.<br><br>
      Stay happy, keep smiling, and have an amazing year ahead! 😊
    </p>
    <div class="heart">❤️</div>
  </div>
</div>

<script>
const balloon=document.getElementById("balloon");
const start=document.getElementById("start");
const wish=document.getElementById("wish");

function confetti(){
  const symbols=["💗","💖","✨","🎉","💕","⭐"];
  for(let i=0;i<90;i++){
    const c=document.createElement("div");
    c.className="confetti";
    c.textContent=symbols[Math.floor(Math.random()*symbols.length)];
    c.style.left=Math.random()*100+"vw";
    c.style.fontSize=(12+Math.random()*18)+"px";
    c.style.animationDuration=(2+Math.random()*3)+"s";
    c.style.animationDelay=Math.random()*.4+"s";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),5500);
  }
}

balloon.addEventListener("click",()=>{
  const rect=balloon.getBoundingClientRect();
  const p=document.createElement("div");
  p.className="pop"; p.textContent="POP! 🎉";
  p.style.left=(rect.left+rect.width/2-55)+"px";
  p.style.top=(rect.top+rect.height/2-20)+"px";
  document.body.appendChild(p);
  balloon.style.transform="scale(1.35)";
  balloon.style.opacity="0";
  setTimeout(()=>{
    start.classList.add("hidden");
    wish.classList.remove("hidden");
    confetti();
  },450);
  setTimeout(()=>p.remove(),800);
});
</script>
</body>
</html>
